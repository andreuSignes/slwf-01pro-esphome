name: Build and Release ESPHome Firmware

on:
  push:
    branches: [main]
    paths:
      - "*.yaml"
      - ".github/workflows/build-and-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0). Leave empty to auto-generate."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile all firmware configs
        run: |
          mkdir -p artifacts
          for config in *.yaml; do
            echo "=== Compiling $config ==="
            name=$(basename "$config" .yaml)

            # Clear previous build output so we can unambiguously find
            # this config's binary afterwards, even if two configs
            # happen to share the same device "name" substitution.
            rm -rf .esphome/build

            esphome compile "$config"

            bin_path=$(find .esphome/build -type f \( -iname "firmware.bin" -o -iname "firmware.factory.bin" \) | head -n 1)

            if [ -z "$bin_path" ]; then
              echo "::error::Could not locate compiled firmware for $config"
              exit 1
            fi

            cp "$bin_path" "artifacts/${name}.bin"
            echo "Copied $bin_path -> artifacts/${name}.bin"
          done
          ls -la artifacts

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate OTA manifests
        run: |
          for config in *.yaml; do
            name=$(basename "$config" .yaml)
            bin_path="artifacts/${name}.bin"
            if [ ! -f "$bin_path" ]; then
              echo "::warning::No compiled binary for $config, skipping manifest"
              continue
            fi
            # Map yaml name -> legacy manifest filename. The repo root
            # is the canonical contract: HA's update: http_request and
            # the SMLIGHT web flasher both read manifest.json / manifest_v1.1.json
            # from the root. Keep these names stable.
            case "$name" in
              slwf01pro_v2.1) manifest_name="manifest" ;;
              slwf01pro_v1.1) manifest_name="manifest_v1.1" ;;
              *)
                echo "::warning::No manifest mapping for $config, skipping"
                continue
                ;;
            esac
            # Pull version from the yaml's project: block so the maintainer
            # controls the schema version in one place (the yaml itself).
            version=$(grep -A 5 'project:' "$config" | grep -E 'version:' | head -1 | sed -E 's/.*version:[[:space:]]*"?([^"]+)"?.*/\1/')
            if [ -z "$version" ]; then
              echo "::warning::No project: version in $config, skipping manifest"
              continue
            fi
            md5=$(md5sum "$bin_path" | awk '{print $1}')
            echo "  ${manifest_name}.json: version=${version}, md5=${md5}"
            cat > "${manifest_name}.json" <<EOF
          {
            "name": "SMLIGHT.SLWF-01Pro",
            "version": "${version}",
            "builds": [
              {
                "chipFamily": "ESP8266",
                "ota": {
                  "md5": "${md5}",
                  "path": "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/${name}.bin",
                  "release_url": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}",
                  "summary": "SMLIGHT SLWF-01Pro ${name} firmware"
                }
              }
            ]
          }
          EOF
          done
          ls -la *.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/*.bin
            manifest.json
            manifest_v1.1.json
          generate_release_notes: true

      - name: Commit manifests to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest_v1.1.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore: regenerate OTA manifests for ${{ steps.tag.outputs.tag }}"
            git push
          fi